<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Connect with The Lab on Facebook, Instagram and Tripadvisor, or view our menu."
    >

    <title>The Lab | Connect With Us</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <main class="page-container">

        <section class="profile-card">

            <div class="decorative-circle circle-one"></div>
            <div class="decorative-circle circle-two"></div>

            <header class="profile-header">

                <div class="logo-container">
                    <img
                        src="images/the-lab-logo.png"
                        alt="The Lab logo"
                        class="profile-logo"
                    >
                </div>

                <h1>The Lab</h1>

                <p class="tagline">
                    Great drinks. Great experiences.
                </p>

                <p class="intro">
                    Follow us, explore our menu and discover what people
                    are saying about The Lab.
                </p>

            </header>

            <nav class="social-links" aria-label="The Lab links">
                <!-- Replace menu.html with your menu page or PDF link -->
                <a
                    href="menu.html"
                    class="social-link menu-link"
                >
                    <span class="icon-container">
                        <i class="fa-solid fa-martini-glass-citrus"></i>
                    </span>

                    <span class="link-text">View Our Menu</span>

                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>         
                       
                <!-- Replace the URL below with your Instagram link -->
                <a
                    href="https://www.instagram.com/YOUR-PAGE"
                    class="social-link instagram-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon-container">
                        <i class="fa-brands fa-instagram"></i>
                    </span>

                    <span class="link-text">Instagram</span>

                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>
                <!-- Replace the URL below with your Facebook link -->
                <a
                    href="https://www.facebook.com/YOUR-PAGE"
                    class="social-link facebook-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon-container">
                        <i class="fa-brands fa-facebook-f"></i>
                    </span>

                    <span class="link-text">Facebook</span>

                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>





                <!-- Replace the URL below with your Tripadvisor link -->
                <a
                    href="https://www.tripadvisor.com/YOUR-PAGE"
                    class="social-link tripadvisor-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon-container">
                       <img
    src="https://cdn.simpleicons.org/tripadvisor/000000"
    alt=""
    class="tripadvisor-icon"
>
                    </span>

                    <span class="link-text">Tripadvisor</span>

                    <i class="fa-solid fa-arrow-right arrow-icon"></i>
                </a>

            </nav>

            <footer class="profile-footer">

                <p>Connect with The Lab</p>

              <a
    href="https://www.google.com/maps/search/?api=1&query=True+Blue+Container+Park+Grenada"
    class="location-link"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open The Lab location in Google Maps"
>
    <i class="fa-solid fa-location-dot"></i>

    <span>
       Container Park, True Blue , Grenada
    </span>

    <small>Tap for directions</small>
</a>

            </footer>

        </section>

    </main>

</body>
</html>
